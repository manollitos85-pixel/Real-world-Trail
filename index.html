<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Map Explorer Pro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* ... [Τα στυλ παραμένουν ίδια για λόγους ταχύτητας] ... */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background-color: #121212; color: #ffffff; }
    #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    #map-container { position: relative; flex: 1; width: 100%; height: 40vh; }
    #map, #fog-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #stats-panel { background: #1e1e1e; padding: 12px; height: 60vh; overflow-y: auto; }
    .btn { padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 5px; }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="map-container">
      <div id="map"></div>
      <canvas id="fog-canvas"></canvas>
    </div>

    <div id="stats-panel">
      <button class="btn" style="background:#2979ff; color:white;" id="track-btn" onclick="toggleTracking()">Έναρξη Καταγραφής</button>
      <div id="status-box" style="font-size:10px; color:#888; text-align:center; margin: 10px 0;">Κατάσταση: Αναμονή...</div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, canvas, ctx, watchId = null, lastPosition = null, pathHistory = [], isTrackingActive = false;

    function initMap() {
      // Φόρτωση τελευταίας θέσης από το ιστορικό ή default
      const savedData = JSON.parse(localStorage.getItem('data') || '{}');
      const startPos = (savedData.pathHistory && savedData.pathHistory.length > 0) 
                       ? [savedData.pathHistory[savedData.pathHistory.length-1].lat, savedData.pathHistory[savedData.pathHistory.length-1].lng] 
                       : [37.9838, 23.7275];

      map = L.map('map', { zoomControl: false }).setView(startPos, 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      
      canvas = document.getElementById('fog-canvas');
      ctx = canvas.getContext('2d');
      loadSavedData();
    }

    function toggleTracking() {
      if (watchId === null) {
        isTrackingActive = true;
        startTracking();
      } else {
        isTrackingActive = false;
        stopTracking();
      }
      localStorage.setItem('trackingState', isTrackingActive);
    }

    function startTracking() {
      if ('geolocation' in navigator) {
        // enableHighAccuracy: false σημαίνει χρήση Wi-Fi/Cell towers (Πιο γρήγορο, λιγότερη ακρίβεια αλλά λειτουργεί παντού)
        watchId = navigator.geolocation.watchPosition(
          pos => {
            const lat = pos.coords.latitude; 
            const lng = pos.coords.longitude;
            lastPosition = { lat, lng };
            map.setView([lat, lng]);
            document.getElementById('status-box').innerText = "Τοποθεσία: Ενεργή (Network/GPS)";
            document.getElementById('status-box').style.color = "#00e676";
            // ... (εδώ προσθέτεις το logic για pathHistory)
          },
          err => {
            document.getElementById('status-box').innerText = "Σφάλμα GPS: Χρήση τελευταίας θέσης";
            document.getElementById('status-box').style.color = "#ff5252";
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 5000 }
        );
      }
    }

    function stopTracking() {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    function loadSavedData() {
        // Επαναφέρει την τελευταία γνωστή θέση χωρίς να χρειάζεται GPS
        const d = JSON.parse(localStorage.getItem('data'));
        if(d && d.pathHistory.length > 0) {
            const last = d.pathHistory[d.pathHistory.length-1];
            map.setView([last.lat, last.lng], 16);
        }
    }

    window.onload = initMap;
  </script>
</body>
</html>
