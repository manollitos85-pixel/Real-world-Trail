<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Map Explorer Pro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background-color: #121212; color: #ffffff; }
    #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    
    #map-container { position: relative; flex: 1; width: 100%; height: 50vh; } /* Ορίζουμε σταθερό χώρο για τον χάρτη */
    #map, #fog-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #fog-canvas { pointer-events: none; z-index: 400; }
    
    #stats-panel { 
      background: #1e1e1e; 
      padding: 10px; 
      border-top-left-radius: 16px; 
      border-top-right-radius: 16px; 
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5); 
      z-index: 1000; 
      flex: 0 0 auto; /* Δεν θα μεγαλώνει παραπάνω από όσο χρειάζεται */
      max-height: 50vh; /* Περιορισμός ύψους για να υπάρχει πάντα χώρος για scroll */
      overflow-y: auto; /* Εδώ μπαίνει η μπάρα κύλισης */
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
    }

    .total-banner { background: #2979ff; color: white; text-align: center; padding: 6px; border-radius: 8px; font-weight: bold; font-size: 12px; }

    .section-title { font-size: 8px; color: #888; text-transform: uppercase; font-weight: bold; margin-top: 4px; }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: #2a2a2a; padding: 6px; border-radius: 8px; }
    
    .stat-box { text-align: center; background: #1e1e1e; padding: 4px; border-radius: 6px; }
    .stat-value { font-size: 11px; font-weight: bold; color: #00e676; }
    .stat-label { font-size: 8px; color: #aaaaaa; text-transform: uppercase; margin-top: 1px; }

    .date-filter-container { background: #2a2a2a; padding: 6px; border-radius: 8px; display: flex; flex-direction: column; gap: 4px; }
    .date-inputs { display: flex; gap: 4px; }
    .date-field { flex: 1; display: flex; flex-direction: column; }
    .date-field label { font-size: 8px; color: #aaa; text-transform: uppercase; }
    .date-field input { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 2px; border-radius: 4px; font-size: 10px; }
    .filter-btn { background: #00e676; color: #121212; border: none; padding: 4px; border-radius: 4px; font-size: 10px; font-weight: bold; }

    .button-group { display: flex; gap: 4px; }
    .btn { padding: 8px; border: none; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-primary { background-color: #2979ff; color: white; }
    .btn-center { background-color: #9c27b0; color: white; }
    .btn-danger { background-color: #ff5252; color: white; }

    .mode-container { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px; border-radius: 6px; }
    .mode-label { font-size: 9px; font-weight: bold; color: #ddd; }
    .switch { position: relative; display: inline-block; width: 30px; height: 16px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .3s; border-radius: 16px; }
    .slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #00e676; }
    input:checked + .slider:before { transform: translateX(14px); }

    .bg-status { font-size: 8px; text-align: center; color: #888; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="map-container">
      <div id="map"></div>
      <canvas id="fog-canvas"></canvas>
    </div>

    <div id="stats-panel">
      <div class="total-banner">
        Ξεκλειδωμένη Περιοχή: <span id="explored-area">0.000</span> km²
      </div>

      <div class="button-group">
        <button class="btn btn-primary" id="track-btn" onclick="toggleTracking()">Έναρξη</button>
        <button class="btn btn-center" onclick="centerToUser()">🎯 Θέση</button>
        <button class="btn btn-danger" onclick="resetData()">Reset</button>
      </div>

      <div class="section-title">Επιλογη Περιοδου</div>
      <div class="date-filter-container">
        <div class="date-inputs">
          <div class="date-field">
            <label>Από:</label>
            <input type="date" id="start-date">
          </div>
          <div class="date-field">
            <label>Εώς:</label>
            <input type="date" id="end-date">
          </div>
        </div>
        <button class="filter-btn" onclick="applyDateFilter()">Εφαρμογή Φίλτρου</button>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-value" id="range-walk">0.00 km</div>
          <div class="stat-label">🚶‍♂️ Πεζός (Εύρος)</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="range-car">0.00 km</div>
          <div class="stat-label">🚗 Όχημα (Εύρος)</div>
        </div>
      </div>

      <div class="section-title">Στατιστικα</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-value" id="walk-month">0.00 km</div><div class="stat-label">🚶‍♂️ Μήνας</div></div>
        <div class="stat-box"><div class="stat-value" id="car-month">0.00 km</div><div class="stat-label">🚗 Μήνας</div></div>
        <div class="stat-box"><div class="stat-value" id="walk-year">0.00 km</div><div class="stat-label">🚶‍♂️ Έτος</div></div>
        <div class="stat-box"><div class="stat-value" id="car-year">0.00 km</div><div class="stat-label">🚗 Έτος</div></div>
        <div class="stat-box"><div class="stat-value" id="walk-distance">0.00 km</div><div class="stat-label">🚶‍♂️ Σύνολο</div></div>
        <div class="stat-box"><div class="stat-value" id="car-distance">0.00 km</div><div class="stat-label">🚗 Σύνολο</div></div>
      </div>

      <div class="mode-container">
        <span class="mode-label">GPS Ακρίβεια</span>
        <label class="switch">
          <input type="checkbox" id="gps-toggle" checked onchange="updateGpsMode()">
          <span class="slider"></span>
        </label>
      </div>
      <div class="bg-status" id="bg-status">Background Mode: Απενεργοποιημένο</div>
    </div>
  </div>

  <audio id="silent-audio" loop style="display:none;"><source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==" type="audio/wav"></audio>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, canvas, ctx, watchId = null, lastPosition = null, pathHistory = [], exploredCells = new Set(), distanceLogs = [], useHighAccuracy = true, wakeLock = null;
    const GRID_SIZE = 0.0003, CELL_AREA_KM2 = 0.0009;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([37.9838, 23.7275], 16);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      canvas = document.getElementById('fog-canvas');
      ctx = canvas.getContext('2d');
      polylineLayer = L.polyline([], { color: '#ff1744', weight: 4, opacity: 0.85 }).addTo(map);
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      
      const now = new Date();
      document.getElementById('start-date').value = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
      document.getElementById('end-date').value = now.toISOString().split('T')[0];
      loadSavedData();
      map.on('move', redrawFog);
    }

    function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; redrawFog(); }
    
    function centerToUser() {
      if (lastPosition) map.setView([lastPosition.lat, lastPosition.lng], 17);
      else navigator.geolocation.getCurrentPosition(pos => map.setView([pos.coords.latitude, pos.coords.longitude], 17));
    }

    function toggleTracking() {
      if (watchId === null) startTracking();
      else stopTracking();
    }

    function startTracking() {
      if ('geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition(pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          exploredCells.add(`${Math.floor(lat / GRID_SIZE)},${Math.floor(lng / GRID_SIZE)}`);
          if (lastPosition) {
             const dist = calculateDistance(lastPosition.lat, lastPosition.lng, lat, lng);
             if (dist > 0.004) {
               const type = (pos.coords.speed * 3.6 >= 15) ? 'car' : 'walk';
               distanceLogs.push({ dist, type, timestamp: Date.now() });
               pathHistory.push({ lat, lng });
               polylineLayer.addLatLng([lat, lng]);
               saveData();
             }
          }
          lastPosition = { lat, lng };
          map.setView([lat, lng]);
          redrawFog();
          updateStatsUI();
        }, null, { enableHighAccuracy: true });
        document.getElementById('track-btn').innerText = "Παύση";
      }
    }

    function stopTracking() {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      document.getElementById('track-btn').innerText = "Έναρξη";
    }

    function updateStatsUI() {
      const start = new Date(document.getElementById('start-date').value).getTime();
      const end = new Date(document.getElementById('end-date').value).getTime() + 86400000;
      let walk = 0, car = 0;
      distanceLogs.forEach(log => {
        if (log.timestamp >= start && log.timestamp <= end) {
          if (log.type === 'walk') walk += log.dist;
          else car += log.dist;
        }
      });
      document.getElementById('range-walk').innerText = walk.toFixed(2) + ' km';
      document.getElementById('range-car').innerText = car.toFixed(2) + ' km';
      document.getElementById('explored-area').innerText = (exploredCells.size * CELL_AREA_KM2).toFixed(3);
    }
    
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    
    function saveData() { localStorage.setItem('data', JSON.stringify({pathHistory, exploredCells: Array.from(exploredCells), distanceLogs})); }
    function loadSavedData() { 
        const d = JSON.parse(localStorage.getItem('data')); 
        if(d) { pathHistory = d.pathHistory; exploredCells = new Set(d.exploredCells); distanceLogs = d.distanceLogs; }
    }
    function resetData() { localStorage.clear(); location.reload(); }
    function redrawFog() { 
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalCompositeOperation = 'destination-out';
        pathHistory.forEach(p => { 
            const pt = map.latLngToContainerPoint([p.lat, p.lng]);
            ctx.beginPath(); ctx.arc(pt.x, pt.y, 40, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';
    }
    window.onload = initMap;
  </script>
</body>
</html>
